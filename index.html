<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning English</title>
  
  <!-- Configuración PWA (Modo Aplicación) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7c6af7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EngLearn">
  
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  
  <!-- Estilos Externos -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVEGACIÓN SUPERIOR -->
  <nav>
    <button class="nav-tab active" id="nav-collection" onclick="showPage('collection')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex-shrink:0">
        <path d="M19 11H5m14 0a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2m14 0V9a2 2 0 0 0-2-2M5 11V9a2 2 0 0 1 2-2m0 0V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2M7 7h10"/>
      </svg>
      MY COLL
    </button>
    <button class="nav-tab" id="nav-categories" onclick="showPage('categories')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex-shrink:0">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      CATEGORIES
    </button>
    <button class="nav-tab" id="nav-yarn" onclick="showPage('yarn')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex-shrink:0">
        <polygon points="23 7 16 12 23 17 23 7" />
        <rect x="1" y="5" width="15" height="14" rx="2" />
      </svg>
      YARN
    </button>
  </nav>

  <!-- PÁGINA 1: MI COLECCIÓN -->
  <div class="page active" id="page-collection">
    <header>
      <div class="pill-tag">✦ Your personal collection</div>
      <h1>Learning English</h1>
    </header>

    <div class="col-main">
      <!-- Search and filter tools -->
      <div class="toolbar">
        <div class="search-wrap">
          <input type="text" id="search" placeholder="Search phrases..." oninput="onSearchInput()" />
          <button id="clear-search" class="clear-btn" onclick="clearSearch()" aria-label="Clear search">✕</button>
        </div>
        <select id="filter-cat" onchange="renderQuotes()">
          <option value="">All categories</option>
        </select>
      </div>

      <!-- Counter and Quotes Grid -->
      <div id="counter" class="counter"></div>
      <div id="grid" class="quotes-grid"></div>
    </div>
  </div>

  <!-- PÁGINA 2: GESTOR DE CATEGORÍAS -->
  <div class="page" id="page-categories">
    <header>
      <div class="pill-tag">✦ Organize your collection</div>
      <h1>Categories</h1>
    </header>
    
    <div class="col-main">
      <div class="toolbar" style="margin-bottom: 20px;">
        <input type="text" id="new-category-input" placeholder="Add a new category..." style="flex: 1;" onkeydown="if(event.key === 'Enter') addCategory()" />
        <button class="btn btn-primary" style="justify-content: center;" onclick="addCategory()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add
        </button>
      </div>
      
      <div id="categories-grid" class="categories-grid"></div>
    </div>
  </div>

  <!-- PÁGINA 3: LEARNING ENGLISH (GETYARN) -->
  <div class="page" id="page-yarn">
    <div class="yarn-main" style="padding: 60px 20px; text-align: center; color: var(--muted); max-width: 600px; margin: 0 auto;">
      <h2 style="color: var(--txt); font-family: 'Syne', sans-serif; font-size: 2rem; margin-bottom: 15px;">Yarn Search</h2>
      <p style="margin-bottom: 30px; line-height: 1.6; font-size: 0.95rem;">
        Search for movie clips using Yarn. You can either click "View clips" from your phrases or search manually below.
      </p>
      
      <div style="background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 25px;">
        <h3 style="font-size: 1.1rem; color: var(--txt); margin-bottom: 15px;">Manual Search</h3>
        <input type="text" id="yarn-manual-search" placeholder="Type a phrase to search on Yarn..." style="width: 100%; margin-bottom: 15px;" onkeydown="if(event.key === 'Enter') searchYarnManual()" />
        <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="searchYarnManual()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          Search on Yarn
        </button>
      </div>
    </div>
  </div>

  <!-- FAB BUTTON (ADD PHRASE) -->
  <button id="fab" onclick="openModal()" aria-label="Add phrase">＋</button>

  <!-- MODAL FOR ADD/EDIT -->
  <div class="modal-overlay" id="modal-overlay" onclick="overlayClick(event)">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <h2 id="modal-title">New <span>phrase</span></h2>
      
      <input type="hidden" id="edit-id" value="" />
      <input type="hidden" id="inp-category" value="General" />
      
      <div class="field-group">
        <textarea id="inp-text" placeholder="Type or paste your phrase here..." maxlength="10000"></textarea>
        
        <div class="category-selector-wrap">
          <label>Category</label>
          <div id="modal-category-chips" class="category-chips"></div>
        </div>
        
        <div class="modal-actions">
          <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" id="modal-save-btn" onclick="saveQuote()">＋ Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- NOTIFICACIONES TOAST -->
  <div id="toast"></div>

  <!-- Script Externo -->
  <script src="script.js"></script>
</body>
</html>
